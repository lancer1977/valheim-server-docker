name: Build, Test and Push Docker Images

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: valheim-docker-build-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Docker Image for Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: valheim-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image to tarball
        run: docker save -o valheim-test.tar valheim-test

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: valheim-test-image
          path: valheim-test.tar
          retention-days: 1

  test:
    name: Run Test Matrix
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        config:
          - name: default
            env: ""
          - name: valheim_plus
            env: "-e VALHEIM_PLUS=true"
          - name: bepinex
            env: "-e BEPINEX=true"
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: valheim-test-image

      - name: Load Docker image from tarball
        run: docker load -i valheim-test.tar

      - name: Run container with ${{ matrix.config.name }} settings
        run: |
          container_name="valheim-test-${{ matrix.config.name }}"
          trap 'docker stop "$container_name" >/dev/null 2>&1 || true; docker rm "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run -d \
            --name "$container_name" \
            --cap-add=sys_nice \
            --stop-timeout 120 \
            -p 2456-2457:2456-2457/udp \
            -e SERVER_NAME="My Server" \
            -e WORLD_NAME="Neotopia" \
            -e SERVER_PASS=secret \
            ${{ matrix.config.env }} \
            valheim-test
          set +e
          timeout --foreground --signal=TERM --kill-after=30s 20m \
            docker exec "$container_name" /usr/local/bin/valheim-tests "${{ matrix.config.name }}"
          test_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            docker inspect --format '{{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}' "$container_name" || true
            docker logs "$container_name" || true
          fi
          exit "$test_status"

  build_and_push:
    name: Build and Push Docker Image
    # `dev` is this fork's default and only active branch — `main` does not
    # exist here. The old guard also allowed `main`, which meant the `latest`
    # tag below could never be produced. See the tag block.
    if: github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # This fork publishes under its own namespace. The upstream
          # `lloesche/valheim-server` targets are not writable from here and
          # were the reason every push on `dev` failed.
          images: |
            lancer1977/valheim-server-docker
          # `latest` is what homelab-gitops deploys, and `dev` is the branch
          # that produces it in this fork.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha
          labels: |
            org.opencontainers.image.title=valheim-server-docker
            org.opencontainers.image.description=Valheim Server
            org.opencontainers.image.url=https://github.com/lancer1977/valheim-server-docker
            org.opencontainers.image.source=https://github.com/lancer1977/valheim-server-docker
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://github.com/lancer1977/valheim-server-docker/blob/dev/README.md
          annotations: |
            org.opencontainers.image.description=Valheim Server
            org.opencontainers.image.source=https://github.com/lancer1977/valheim-server-docker
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha

      # The QA runbook pins deploys by digest rather than by a floating tag,
      # so surface it in the run summary instead of only in the build log.
      - name: Publish image digest to the run summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.docker_build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "tags:" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
